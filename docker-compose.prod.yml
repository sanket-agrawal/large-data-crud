version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: large-data-crud-app
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
