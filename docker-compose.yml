version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: large-data-crud-app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123
    restart: unless-stopped
